name: Collect Info

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: collect-info
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate probinfo
        run: |
          python scripts/collect_info.py

      - name: Upload probinfo artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-python-probinfo
          path: runtime/solar/metadata/probinfo.csv

      - name: Commit probinfo update
        run: |
          git add runtime/solar/metadata/probinfo.csv
          if git diff --staged --quiet; then
            echo "No probinfo changes detected."
          else
            git commit -m "Auto-update SOLAR Python probinfo"
            git push
          fi
