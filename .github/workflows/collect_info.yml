name: Collect Info

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-info
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout OptiProfiler
        uses: actions/checkout@v4
        with:
          repository: optiprofiler/optiprofiler
          path: optiprofiler
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install OptiProfiler
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e optiprofiler
          python -m pip install -e . --no-deps --no-build-isolation

      - name: Regenerate probinfo
        run: |
          python scripts/collect_info.py

      - name: Upload probinfo artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-python-probinfo
          path: runtime/solar/metadata/probinfo.csv
