[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "optiprofiler-solar"
description = "OptiProfiler problem-library plugin for the SOLAR benchmark"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "BSD-3-Clause AND LGPL-2.1-only AND LGPL-3.0-or-later"}
authors = [
    {name = "Cunxin Huang", email = "cun-xin.huang@connect.polyu.hk"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.17.0",
    "optiprofiler>=1.4.0",
]
version = "0.1.0"

[project.entry-points."optiprofiler.problem_libraries"]
solar = "optiprofiler_solar:get_problem_library"

[project.urls]
homepage = "https://www.optprof.com"
source = "https://github.com/optiprofiler/solar_python"
upstream = "https://github.com/bbopt/solar"

[tool.setuptools]
packages = ["optiprofiler_solar"]
package-dir = {"optiprofiler_solar" = "."}
include-package-data = false

[tool.setuptools.package-data]
optiprofiler_solar = [
    "LICENSE",
    "README.md",
    "THIRD_PARTY_NOTICES.md",
    "licenses/GPL-3.0.txt",
    "licenses/LGPL-3.0.txt",
    "runtime/solar/LICENSE",
    "runtime/solar/README.md",
    "runtime/solar/README.upstream.md",
    "runtime/solar/manifest.json",
    "runtime/solar/metadata/problems.json",
    "runtime/solar/metadata/probinfo.csv",
    "runtime/solar/src/*.cpp",
    "runtime/solar/src/*.hpp",
    "runtime/solar/src/makefile",
]
